{% extends "base.html" %}
{% set active = page.slug %}
{% block title %}{{ page.title }} · {{ SITENAME }}{% endblock %}
{% block rel_url %}{{ page.url }}{% endblock %}

{% block content %}
<header class="page-hero slim">
  <div class="hex-bg" aria-hidden="true"></div>
  <div class="wrap narrow"><h1>{{ page.title }}</h1></div>
</header>
<div class="wrap narrow prose">{{ page.content }}</div>
{% endblock %}
